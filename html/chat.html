<!--
Chatroom Page
Displays a chatroom(placeholder for websocket), a field for typing a message, a send button, and an image of a chat bubble
link to fridge.html
display username at the top
footer contains the text 'Brandon Peart' with a link to https://github.com/peartbrandon6/startup
-->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="chat.css">
	<title>FridgeMate - Chatroom</title>
</head>
<body>
	<header>
		<h1>Chatroom</h1>
		<p>USERNAME</p>
	</header>

	<main class="chat-layout">
		<section class="chat-room" aria-labelledby="chat-heading">
			<h2 id="chat-heading">FridgeMate Chat</h2>
			<p>Chatroom messages from the WebSocket will appear here.</p>

			<article aria-label="Chatroom message placeholder">
				<p><strong>USERNAME:</strong> Chat message placeholder</p>
			</article>

			<form action="#" method="post">
				<p>
					<label for="message">Message</label>
					<textarea id="message" name="message" rows="4" cols="40" placeholder="Type a message" required></textarea>
				</p>
				<button class="btn btn-primary" type="submit">Send</button>
			</form>
		</section>

		<section class="chat-image">
			<img src="https://images.unsplash.com/photo-1577563908411-5077b6dc7624?auto=format&fit=crop&w=800&q=80" alt="Chat bubbles on a screen">
		</section>

		<nav class="site-nav" aria-label="Site links">
			<h2>Links</h2>
			<a href="fridge.html">Return to the fridge</a>
		</nav>
	</main>

	<footer>
		<p>Created by <a href="https://github.com/peartbrandon6/startup">Brandon Peart</a></p>
	</footer>
</body>
</html>

<!--
Login Page
Displays a login button, create account button, and two fields for a username and a password (for now, they are placeholders but will be HTML endpoints to talk to the database).
Links to fridge.html
Footer contains the text 'Brandon Peart' with a link to https://github.com/peartbrandon6/startup
-->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>FridgeMate</title>
</head>
<body>
	<header>
		<h1>FridgeMate</h1>
		<p>Keep track of what is in your fridge.</p>
	</header>

	<main>
		<section aria-labelledby="login-heading">
			<h2 id="login-heading">Log in</h2>

			<form action="#" method="post">
				<p>
					<label for="username">Username</label>
					<input id="username" name="username" type="text" placeholder="Enter your username" required>
				</p>

				<p>
					<label for="password">Password</label>
					<input id="password" name="password" type="password" placeholder="Enter your password" required>
				</p>

				<p>
					<a href="fridge.html"><button type="submit">Log in</button></a>
				</p>
			</form>

			<p>
				<a href="fridge.html"><button type="button">Create an account</button></a>
			</p>

		</section>
	</main>

	<footer>
		<p>Created by <a href="https://github.com/peartbrandon6/startup">Brandon Peart</a></p>
	</footer>
</body>
</html>
